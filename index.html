<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SGDE DUA FARMA</title>
    <link href="css/estilos.css" rel="stylesheet">
    <script src="js/tema.js"></script>
    <style>
        body { margin:0; font-family: 'Nunito', -apple-system, sans-serif; }
        .login-wrapper { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(circle at 15% 20%,rgba(87,211,166,.2),transparent 26%),radial-gradient(circle at 85% 80%,rgba(45,152,185,.2),transparent 28%),linear-gradient(135deg,#0b3d32 0%,#176b55 55%,#135d6c 100%); position:relative; overflow:hidden; }
        .login-wrapper::before { content:''; position:absolute; width:420px; height:420px; top:-230px; right:-160px; border:1px solid rgba(255,255,255,.14); border-radius:50%; box-shadow:0 0 0 55px rgba(255,255,255,.035),0 0 0 110px rgba(255,255,255,.025); }
        .login-card { position:relative; z-index:1; background:rgba(255,255,255,.98); border:1px solid rgba(255,255,255,.7); border-radius:22px; padding:38px 40px 34px; width:100%; max-width:430px; box-shadow:0 28px 75px rgba(4,35,28,.3); }
        .login-logo { text-align:center; margin-bottom:24px; }
        .login-logo img { width:112px; height:112px; padding:7px; object-fit:contain; border-radius:22px; background:#fff; box-shadow:0 10px 28px rgba(23,107,85,.16); }
        .login-logo .icon { font-size:3rem; }
        .login-logo h1 { color:#164f40; font-size:1.5rem; font-weight:800; letter-spacing:.02em; margin:15px 0 5px; }
        .login-logo p { color:#6b7d77; font-size:.84rem; margin:0; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:.8rem; font-weight:700; color:#374151; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
        .form-group input { width:100%; padding:12px 14px; border:1.5px solid #d5e2dd; border-radius:10px; font-size:.9rem; color:#24332f; outline:none; transition:.2s; box-sizing:border-box; background:#fbfdfc; }
        .form-group input:focus { border-color:#2fa76f; box-shadow:0 0 0 3px rgba(47,167,111,.15); }
        .rol-info { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
        .rol-badge { padding:4px 10px; border-radius:20px; font-size:.72rem; font-weight:700; }
        .rol-admin { background:#fef3c7; color:#92400e; }
        .rol-asistente { background:#dbeafe; color:#1e40af; }
        .rol-auxiliar { background:#d1fae5; color:#065f46; }
        .btn-login { width:100%; padding:13px; background:linear-gradient(135deg,#155b49,#2b9b77); color:#fff; border:none; border-radius:11px; font-size:.95rem; font-weight:800; letter-spacing:.01em; cursor:pointer; transition:.2s; margin-top:4px; box-shadow:0 7px 18px rgba(23,107,85,.23); }
        .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(47,167,111,.4); }
        .cuentas-demo { background:#f3f8f6; border:1px solid #deebe6; border-radius:12px; padding:14px; margin-top:18px; font-size:.78rem; color:#64748b; }
        .cuentas-demo strong { color:#374151; display:block; margin-bottom:8px; }
        .cuenta-row { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #e5e7eb; }
        .cuenta-row:last-child { border-bottom:none; }
        #error-msg { display:none; padding:9px 10px; margin:0 0 12px; border-radius:8px; background:#fff0f0; }
        @media (max-width:480px) { .login-card { padding:30px 22px; } .login-logo img { width:96px; height:96px; } }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <img src="imagen.png" alt="Descripción de la imagen">
            <h1>SGDE DUA FARMA</h1>
            <p>Sistema de Gestión Documental Electrónica · BPA</p>
        </div>

        <div class="rol-info">
            <span class="rol-badge rol-admin">👑 Director Técnico</span>
            <span class="rol-badge rol-asistente">🧑‍💼 Jefe de almacén</span>
            <span class="rol-badge rol-auxiliar">🧑‍🔧 Gerente general</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="login-usuario" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="Ingresa tu contraseña" required>
            </div>
            <div id="error-msg">Usuario o contraseña incorrectos</div>
            <button type="submit" class="btn-login">Ingresar al sistema</button>
        </form>

        <div class="cuentas-demo">
            <strong>Cuentas de prueba (ver sql/schema.sql):</strong>
            <div class="cuenta-row"><span>admin</span><span>admin123</span></div>
            <div class="cuenta-row"><span>asistente</span><span>asist123</span></div>
            <div class="cuenta-row"><span>auxiliar</span><span>aux123</span></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/login.js"></script>
</body>
</html>
